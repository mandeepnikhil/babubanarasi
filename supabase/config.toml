# Supabase CLI settings for the Babu Banarasi server functions.
# Guests can check out, and Razorpay calls the webhook directly, so these
# functions check identity and signatures themselves instead of requiring a login token.

[functions.create-order]
verify_jwt = false

[functions.verify-payment]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false
